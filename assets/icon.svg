<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Light sky-blue background -->
  <circle cx="100" cy="100" r="96" fill="#EAF7FD"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#BDE4F1" stroke-width="1.5"/>

  <!--
    Three C-shaped arcs arranged in a triskelion.
    Each C's opening faces the center — three streams converging to a confluence.

    Arc math:
      Circle center: (100, 56)  radius: 36
      Start: angle 135° → (100 + 36·cos135°, 56 + 36·sin135°) ≈ (74.5, 81.5)
      End:   angle  45° → (100 + 36·cos45°,  56 + 36·sin45°)  ≈ (125.5, 81.5)
      large-arc=1, sweep=1 (CW) → 270° arc, gap at bottom (facing center)
  -->

  <!-- C1: top — opening faces downward toward center -->
  <path d="M 74,81 A 36,36 0 1 1 126,81"
        fill="none" stroke="#6AC3DC" stroke-width="14" stroke-linecap="round" opacity="0.90"/>

  <!-- C2: rotated 120° — lower-right, opening faces upper-left toward center -->
  <path d="M 74,81 A 36,36 0 1 1 126,81"
        transform="rotate(120,100,100)"
        fill="none" stroke="#85CEDF" stroke-width="14" stroke-linecap="round" opacity="0.85"/>

  <!-- C3: rotated 240° — lower-left, opening faces upper-right toward center -->
  <path d="M 74,81 A 36,36 0 1 1 126,81"
        transform="rotate(240,100,100)"
        fill="none" stroke="#A1D9E8" stroke-width="14" stroke-linecap="round" opacity="0.80"/>

  <!-- Confluence: the central point where the three streams meet -->
  <circle cx="100" cy="100" r="9"   fill="#47B3CC" opacity="0.88"/>
  <circle cx="100" cy="100" r="3.5" fill="#D8F0F8"/>
</svg>
